name: Generate Faceless Short / Reel

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video concept or story prompt'
        required: true
        default: 'The man who bought an entire bank for $1'
      style:
        description: 'Visual style'
        required: false
        default: 'Tall Tale 3D'
      pillar:
        description: 'Dragon Studios Pillar (NONE, DARK_PSYCHOLOGY, ORIGINAL_MANGA, AI_TOOLS, CONVERSATIONAL_PODCAST)'
        required: false
        default: 'NONE'
      voice:
        description: 'Voice identifier (auto, en-US-EricNeural, en-GB-RyanNeural, en-US-JennyNeural, en-US-ChristopherNeural)'
        required: false
        default: 'auto'
      publish_platforms:
        description: 'Publishing targets (ALL, YOUTUBE, INSTAGRAM, TELEGRAM)'
        required: false
        default: 'ALL'
      slug:
        description: 'Project slug identifier'
        required: false
        default: 'cloud_reel'

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fontconfig
          fc-cache -fv

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Notify Telegram of Render Start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚙️ *Cloud Studio Runner Activated!*\\n\\n🎬 *Topic:* ${{ inputs.prompt }}\\n🎨 *Style:* ${{ inputs.style }}\\n🎙️ *Voice:* ${{ inputs.voice }}\\n\\n⏳ Synthesizing adaptive scenes, character direction & viral subtitles...\", \"parse_mode\": \"Markdown\"}"
          fi

      - name: Generate Faceless Short or Dragon Studios Reel
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          TARGET="${{ inputs.style }}"
          MODE="FACELESS_3D"
          if [ "${{ inputs.pillar }}" != "NONE" ] && [ -n "${{ inputs.pillar }}" ]; then
            TARGET="${{ inputs.pillar }}"
            MODE="DRAGON_PILLAR"
          fi
          python unified_cloud_dispatcher.py \
            --prompt "${{ inputs.prompt }}" \
            --mode "$MODE" \
            --target "$TARGET" \
            --voice "${{ inputs.voice }}" \
            --slug "${{ inputs.slug }}"
          mkdir -p "output/faceless/${{ inputs.slug }}"
          cp "output/final/${{ inputs.slug }}_master.mp4" "output/faceless/${{ inputs.slug }}/${{ inputs.slug }}_final.mp4"

      - name: Create Public Video Release (Permanent CDN for Meta & YouTube)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v-${{ inputs.slug }}" "output/faceless/${{ inputs.slug }}/${{ inputs.slug }}_final.mp4" \
            --title "${{ inputs.prompt }}" \
            --notes "Automated Faceless Short" || true

      - name: Deliver to Telegram & Publish to YouTube / Instagram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          python publish_reel.py \
            --video "output/faceless/${{ inputs.slug }}/${{ inputs.slug }}_final.mp4" \
            --public-url "https://github.com/${{ github.repository }}/releases/download/v-${{ inputs.slug }}/${{ inputs.slug }}_final.mp4" \
            --prompt "${{ inputs.prompt }}" \
            --style "${{ inputs.style }}" \
            --platforms "${{ inputs.publish_platforms }}" \
            --slug "${{ inputs.slug }}"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.slug }}
          path: output/faceless/${{ inputs.slug }}/${{ inputs.slug }}_final.mp4
          retention-days: 30
