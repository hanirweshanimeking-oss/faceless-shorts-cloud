name: Antigravity Autonomous Cloud Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Antigravity task, coding request, or studio goal'
        required: true
        default: 'Audit repository status and report system health'
      auto_commit:
        description: 'Auto-commit code changes to main'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  run_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js & Install OpenCode CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-cjk
          fc-cache -fv
          npm install -g opencode-ai@latest || true
          which opencode || echo "OpenCode installation finished"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Antigravity Autonomous Cloud Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTO_COMMIT_FLAG=""
          if [ "${{ inputs.auto_commit }}" = "true" ]; then
            AUTO_COMMIT_FLAG="--auto-commit"
          fi
          python antigravity_cloud_agent.py "${{ inputs.task }}" $AUTO_COMMIT_FLAG
